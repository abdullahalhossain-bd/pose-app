name: ai_visual_director
description: "AI Visual Director — A Personal Photography Intelligence Platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Routing ───────────────────────────────────────────────────────
  go_router: ^16.2.0

  # ── Environment & config ──────────────────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── Functional programming (Either for error handling) ────────────
  fpdart: ^1.1.1

  # ── Logging ───────────────────────────────────────────────────────
  logger: ^2.5.0

  # ── Storage (local persistence for sessions, prefs) ───────────────
  shared_preferences: ^2.5.0

  # ── Networking (foundation for Day 8+) ────────────────────────────
  dio: ^5.8.0+1

  # ── Utilities ─────────────────────────────────────────────────────
  collection: ^1.19.1
  uuid: ^4.5.1
  intl: ^0.20.2

  # ── Camera ────────────────────────────────────────────────────────
  camera: ^0.12.0+1
  permission_handler: ^11.4.0
  photo_manager: ^3.9.0

  # ── On-device AI ──────────────────────────────────────────────────
  # ML Kit Pose Detection — streaming mode, no API key, cross-platform
  google_mlkit_pose_detection: ^0.15.0
  google_mlkit_commons: ^0.12.0

  # ── Device info (for thermal/battery/GPU capability detection) ────
  device_info_plus: ^13.2.0
  battery_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.dev
    - .env.staging
    - .env.prod
