name: Flutter CI

# Runs the exact verification steps that could NOT be executed in the
# development sandbox (no network access to pub.dev/storage.googleapis.com
# there — see docs/P0_VERIFICATION_REPORT.md §1). This workflow is the real
# source of truth for "does it build" going forward, not a claim in a doc.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: pub get / analyze / test / build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

  format-check:
    name: dart format --output=none --set-exit-if-changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
